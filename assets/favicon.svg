<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="ST">
  <!-- Signal-lime ground with dark ink: a face is unreadable at 16px, initials are not. -->
  <rect width="32" height="32" rx="7" fill="#BFED5F"/>
  <text x="16" y="16"
        font-family="Archivo, 'Helvetica Neue', Helvetica, Arial, sans-serif"
        font-size="17" font-weight="700" letter-spacing="-0.9"
        text-anchor="middle" dominant-baseline="central"
        fill="#0D1107">ST</text>
</svg>
